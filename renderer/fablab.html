<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FacLab Manager — TigerTag Studio</title>
<style>
/* ===== DESIGN TOKENS (matches TigerTag Studio dark theme) ===== */
:root{
  --bg:#111315;--panel:#18191C;--panel-2:#1F2124;--panel-3:#26292D;
  --line:#2D3035;--line-2:#363B41;
  --text:#E8E6E1;--muted:#7A8087;--muted2:#545A61;
  --amber:#FF8B00;--amber-dim:rgba(255,139,0,.13);--amber-glow:rgba(255,139,0,.07);
  --teal:#2FD47A;--teal-dim:rgba(47,212,122,.12);
  --red:#FF4A4A;--red-dim:rgba(255,74,74,.12);
  --blue:#3FA9F5;--blue-dim:rgba(63,169,245,.12);
  --yellow:#F5C842;--yellow-dim:rgba(245,200,66,.12);
  --radius:9px;--radius-sm:6px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:13px; color:var(--text);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);min-height:100vh;display:flex;overflow:hidden;}

/* ===== SIDEBAR ===== */
.sidebar{
  width:210px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:0 0 12px;height:100vh;overflow-y:auto;
}
.sidebar-header{
  padding:16px 14px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.back-btn{
  background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
  border-radius:var(--radius-sm);padding:5px 9px;cursor:pointer;font-size:12px;
  font-family:inherit;
}
.back-btn:hover{color:var(--text);border-color:var(--line-2);}
.brand{flex:1;}
.brand .name{font-weight:700;font-size:13.5px;color:var(--text);}
.brand .sub{font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
.nav-section{padding:10px 8px 4px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted2);padding:0 6px;margin-bottom:4px;}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;
  border:1px solid transparent;user-select:none;
}
.nav-item:hover{background:var(--panel-2);color:var(--text);}
.nav-item.active{background:var(--amber-dim);color:var(--amber);border-color:rgba(255,139,0,.2);}
.nav-item .ic{width:16px;text-align:center;font-size:13px;flex-shrink:0;}
.nav-item .count{margin-left:auto;font-size:10.5px;background:var(--panel-3);
  padding:1px 6px;border-radius:20px;color:var(--muted);}
.nav-item.active .count{background:rgba(255,139,0,.2);color:var(--amber);}
.sidebar-foot{margin-top:auto;padding:12px 14px;font-size:10.5px;color:var(--muted2);line-height:1.5;}

/* ===== MAIN ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{
  padding:14px 22px;border-bottom:1px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,.15),transparent);
}
.topbar-left h1{font-size:16px;font-weight:700;margin-bottom:1px;}
.topbar-left p{font-size:11.5px;color:var(--muted);}
.content{flex:1;overflow-y:auto;padding:18px 22px 60px;}

/* ===== UTILITIES ===== */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.spacer{flex:1;}
input,select,textarea{
  background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  border-radius:var(--radius-sm);padding:7px 10px;font-size:12.5px;
  font-family:inherit;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--amber);}
button.btn{
  background:var(--amber);color:#1A0E00;border:none;border-radius:var(--radius-sm);
  padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
button.btn:hover{filter:brightness(1.1);}
button.btn-ghost{
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:6px 12px;font-size:12.5px;font-weight:600;
  cursor:pointer;font-family:inherit;
}
button.btn-ghost:hover{border-color:var(--line-2);background:var(--panel-3);}
button.btn-danger{
  background:var(--red-dim);color:var(--red);border:1px solid rgba(255,74,74,.2);
  border-radius:var(--radius-sm);padding:5px 9px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
button.btn-sm{padding:4px 8px;font-size:11.5px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px;}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.stat-card .sv{font-size:28px;font-weight:800;line-height:1;}
.stat-card .sl{font-size:11px;color:var(--muted);margin-top:3px;}
.stat-card.amber .sv{color:var(--amber);}
.stat-card.teal .sv{color:var(--teal);}
.stat-card.red .sv{color:var(--red);}
.stat-card.blue .sv{color:var(--blue);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
.card-head{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;}
.card-head h2{font-size:13.5px;font-weight:700;flex:1;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--panel-2);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.badge.ok{background:var(--teal-dim);color:var(--teal);}
.badge.warn{background:var(--yellow-dim);color:var(--yellow);}
.badge.bad{background:var(--red-dim);color:var(--red);}
.badge.info{background:var(--blue-dim);color:var(--blue);}
.badge.neutral{background:var(--panel-3);color:var(--muted);}

.tag{font-size:10.5px;color:var(--muted);background:var(--panel-3);padding:1px 6px;border-radius:4px;}
.muted{color:var(--muted);}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:12.5px;}
.scrollx{overflow-x:auto;}
.searchbar{position:relative;}
.searchbar::before{content:"⌕";position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.searchbar input{padding-left:28px;width:200px;}
::placeholder{color:var(--muted2);}

/* qty buttons */
.qty-row{display:flex;align-items:center;gap:5px;}
.qty-row button{
  background:var(--panel-3);border:1px solid var(--line);color:var(--text);
  border-radius:4px;width:22px;height:22px;cursor:pointer;font-family:inherit;font-size:14px;line-height:1;
}
.qty-row button:hover{border-color:var(--amber);color:var(--amber);}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:999;}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:20px;width:400px;max-width:92vw;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal h3{font-size:14.5px;font-weight:700;margin-bottom:16px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select,.field textarea{width:100%;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
</style>
</head>

    maintenance: [{id:'mt0',machine:'Découpeuse Laser Flux HEXA',issue:'Machine hors service — retirer du catalogue site',status:'En attente',priority:'Haute',reportedBy:'Admin',date:today()}],
    filters:{machineCat:'all',machineStatus:'all',search:''},
  };
}

function saveState(s){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      machines:s.machines, consumables:s.consumables, users:s.users,
      reservations:s.reservations, maintenance:s.maintenance,
    }));
  }catch(e){}
}

let S = loadState();
let modal = null;
function today(){return new Date().toISOString().slice(0,10);}
function uid(p){return p+Math.random().toString(36).slice(2,8);}
function esc(v){return (v==null?'':String(v)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function set(patch){ S={...S,...patch}; saveState(S); render(); }

/* ===== NAV ===== */
const NAV=[
  {id:'dashboard',label:'Tableau de bord',icon:'◆'},
  {id:'machines',label:'Machines',icon:'⚙'},
  {id:'consumables',label:'Consommables',icon:'▤'},
  {id:'reservations',label:'Réservations',icon:'◷'},
  {id:'maintenance',label:'Maintenance',icon:'⚠'},
  {id:'users',label:'Utilisateurs',icon:'☺'},
];
function navCount(id){
  if(id==='machines') return S.machines.length;
  if(id==='consumables') return S.consumables.length;
  if(id==='reservations') return S.reservations.filter(r=>r.date>=today()).length;
  if(id==='maintenance') return S.maintenance.filter(m=>m.status!=='Résolu').length;
  if(id==='users') return S.users.length;
  return '';
}

/* ===== STATUS HELPERS ===== */
function statusBadge(s){
  const m={OK:['ok','✓ OK'],'Non conforme':['warn','◐ Non conforme'],'Indisponible':['bad','✕ Indispo']};
  const[cls,lbl]=m[s]||['neutral',s||'—'];
  return `<span class="badge ${cls}"><span class="dot"></span>${esc(lbl)}</span>`;
}
function priorBadge(p){
  const m={Haute:'bad',Moyenne:'warn',Basse:'neutral'};
  return `<span class="badge ${m[p]||'neutral'}"><span class="dot"></span>${esc(p)}</span>`;
}
function maintBadge(s){
  const m={'En attente':'warn','En cours':'info',Résolu:'ok'};
  return `<span class="badge ${m[s]||'neutral'}"><span class="dot"></span>${esc(s)}</span>`;
}

/* ===== RENDER ROOT ===== */
function render(){
  document.getElementById('app').innerHTML =

  bindEvents();
}

function sidebar(){
  return `<div class="sidebar">

          <span class="count">${navCount(n.id)}</span>

/* ===== EVENTS ===== */
function bindEvents(){
  // Nav
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>set({tab:el.dataset.nav}));
  const back=document.getElementById('backBtn');
  if(back) back.onclick=()=>{ if(window.location.pathname.includes('fablab')){ window.location.href='inventory.html'; } };

  // Filters
  const sm=document.getElementById('searchM');
  if(sm) sm.oninput=e=>set({filters:{...S.filters,search:e.target.value}});
  const fc=document.getElementById('filterCat');
  if(fc) fc.onchange=e=>set({filters:{...S.filters,machineCat:e.target.value}});
  const fst=document.getElementById('filterSt');
  if(fst) fst.onchange=e=>set({filters:{...S.filters,machineStatus:e.target.value}});

  // Add buttons
  ['addMachine','addCons','addRes','addMaint','addUser'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.onclick=()=>{
      const map={addMachine:'machine',addCons:'consumable',addRes:'reservation',addMaint:'maintenance',addUser:'user'};
      modal={type:map[id],data:null}; render();
    };
  });

  // Edit machines
  document.querySelectorAll('[data-edit-m]').forEach(el=>el.onclick=()=>{
    modal={type:'machine',data:S.machines.find(m=>m.id===el.dataset.editM)}; render();
  });
  document.querySelectorAll('[data-del-m]').forEach(el=>el.onclick=()=>{
    if(confirm('Supprimer cette machine ?')) set({machines:S.machines.filter(m=>m.id!==el.dataset.delM)});
  });
  // Edit consumables
  document.querySelectorAll('[data-dq]').forEach(el=>el.onclick=()=>
    set({consumables:S.consumables.map(c=>c.id===el.dataset.dq?{...c,qty:Math.max(0,c.qty-1)}:c)}));
  document.querySelectorAll('[data-iq]').forEach(el=>el.onclick=()=>
    set({consumables:S.consumables.map(c=>c.id===el.dataset.iq?{...c,qty:c.qty+1}:c)}));
  document.querySelectorAll('[data-edit-c]').forEach(el=>el.onclick=()=>{
    modal={type:'consumable',data:S.consumables.find(c=>c.id===el.dataset.editC)}; render();
  });
  document.querySelectorAll('[data-del-c]').forEach(el=>el.onclick=()=>{
    if(confirm('Supprimer ?')) set({consumables:S.consumables.filter(c=>c.id!==el.dataset.delC)});
  });
  // Reservations
  document.querySelectorAll('[data-del-r]').forEach(el=>el.onclick=()=>
    set({reservations:S.reservations.filter(r=>r.id!==el.dataset.delR)}));
  // Maintenance
  document.querySelectorAll('.maint-status').forEach(el=>el.onchange=()=>
    set({maintenance:S.maintenance.map(m=>m.id===el.dataset.mid?{...m,status:el.value}:m)}));
  document.querySelectorAll('[data-del-mt]').forEach(el=>el.onclick=()=>{
    if(confirm('Supprimer ce ticket ?')) set({maintenance:S.maintenance.filter(m=>m.id!==el.dataset.delMt)});
  });
  // Users
  document.querySelectorAll('[data-edit-u]').forEach(el=>el.onclick=()=>{
    modal={type:'user',data:S.users.find(u=>u.id===el.dataset.editU)}; render();
  });
  document.querySelectorAll('[data-del-u]').forEach(el=>el.onclick=()=>{
    if(confirm('Supprimer ?')) set({users:S.users.filter(u=>u.id!==el.dataset.delU)});
  });

  // Modal
  const bg=document.getElementById('modalBg');
  if(bg) bg.onclick=e=>{if(e.target.id==='modalBg'){modal=null;render();}};
  const mc=document.getElementById('mCancel');
  if(mc) mc.onclick=()=>{modal=null;render();};
  const ms=document.getElementById('mSave');
  if(ms) ms.onclick=saveModal;
}

function v(id){const el=document.getElementById(id);return el?el.value.trim():'';}

function saveModal(){
  const t=modal.type;
  if(t==='machine'){
    const d={name:v('fn'),category:v('fcat'),qty:parseInt(v('fqty'))||0,
      present_faclab:v('fpf'),present_site:v('fps'),status:v('fst'),comment:v('fcmt')};
    if(!d.name)return;
    if(modal.data?.id) set({machines:S.machines.map(m=>m.id===modal.data.id?{...m,...d}:m)});
    else set({machines:[...S.machines,{id:uid('m'),note:'',...d}]});
  }
  else if(t==='consumable'){
    const d={name:v('fn'),category:v('fcat'),qty:parseInt(v('fqty'))||0,
      unit:v('funit'),threshold:parseInt(v('fthr'))||0,location:v('floc')};
    if(!d.name)return;
    if(modal.data?.id) set({consumables:S.consumables.map(c=>c.id===modal.data.id?{...c,...d}:c)});
    else set({consumables:[...S.consumables,{id:uid('c'),...d}]});
  }
  else if(t==='reservation'){
    const d={machine:v('fmac'),user:v('fusr'),date:v('fdate'),start:v('fstart'),end:v('fend'),note:v('fnote')};
    if(!d.user||!d.date)return;
    set({reservations:[...S.reservations,{id:uid('r'),...d}]});
  }
  else if(t==='maintenance'){
    const d={machine:v('fmac'),issue:v('fissue'),reportedBy:v('freporter'),priority:v('fprio'),status:'En attente',date:today()};
    if(!d.issue)return;
    set({maintenance:[...S.maintenance,{id:uid('mt'),...d}]});
  }
  else if(t==='user'){
    const d={name:v('fn'),role:v('frole'),email:v('femail'),
      habilitations:document.getElementById('fhab').value.split(',').map(s=>s.trim()).filter(Boolean)};
    if(!d.name)return;
    if(modal.data?.id) set({users:S.users.map(u=>u.id===modal.data.id?{...u,...d}:u)});
    else set({users:[...S.users,{id:uid('u'),...d}]});
  }
  modal=null; render();
}

render();
</script>
</body>
</html>
